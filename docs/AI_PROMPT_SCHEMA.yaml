## 🧪 Validation Script (验证脚本)

```python
# validate_prompts.py - Run this to check all prompts against schema
from pathlib import Path
import yaml
import json
from typing import Any, Dict, List

def load_schema(schema_path: str) -> dict:
    """Load YAML schema definition."""
    with open(schema_path) as f:
        return yaml.safe_load(f)

def validate_archetype(data: dict, path: str = "") -> list:
    """Validate archetype_library data against rules."""
    errors = []
    
    if not isinstance(data.get("archetype", {}).get("personality_traits", []), list):
        errors.append(f"{path}: personality_traits must be a list")
    elif len(data["archetype"]["personality_traits"]) > 10:
        errors.append(f"{path}: Maximum 10 personality traits recommended")
    
    base_prompt = data.get("archetype", {}).get("base_prompt", "")
    if len(base_prompt) > 500:
        errors.append(f"{path}: base_prompt exceeds 500 characters (length={len(base_prompt)})")
    
    return errors

def validate_task(data: dict, path: str = "") -> list:
    """Validate task_orchestrator data against rules."""
    errors = []
    steps = data.get("task", {}).get("steps", [])
    
    if not isinstance(steps, list) or len(steps) < 3:
        errors.append(f"{path}: Steps must have at least 3 elements")
    elif len(steps) > 12:
        errors.append(f"{path}: Maximum 12 steps recommended for maintainability")
    
    # Check sequential numbering
    seen = set()
    for i, step in enumerate(steps):
        step_num = step.get("step_number", i + 1)
        if step_num not in seen:
            seen.add(step_num)
        else:
            errors.append(f"{path}[{i}]: Duplicate or non-sequential step_number={step_num}")
    
    return errors

def validate_all_prompts(root_dir: str = "prompts") -> Dict[str, list]:
    """Validate all prompt files in the given directory."""
    results = {}
    for file_path in Path(root_dir).rglob("*.yaml"): 
        try:
            with open(file_path) as f:
                data = yaml.safe_load(f)
            errors = validate_archetype(data, str(file_path)) or \
                     validate_task(data, str(file_path))  # Try both validators
            results[str(file_path)] = errors if errors else ["✓ Valid"]
        except Exception as e:
            results[str(file_path)] = [f"✗ Error: {e}"]
    return results

if __name__ == "__main__":
    print("=== TalkingArtProject Prompt Validation ===")
    report = validate_all_prompts()
    
    for file, issues in report.items():
        status = "✅ PASS" if "PASS" in str(issues) else f"❌ FAIL: {len([i for i in issues if 'FAIL' in str(i)])} errors"
        print(f"  {file.split('/')[-1]}: {status}")
```

