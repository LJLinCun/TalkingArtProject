# AI Agent Prompt Validation Schema
# AI 智能体提示词验证模式 - TalkingArtProject v2.0

---

## 📋 Overview (概述)

This YAML schema validates prompt definitions in the TalkingArtProject ecosystem, ensuring consistency across character archetypes, task orchestrations, and style transfers.

此 YAML 模式验证 TalkingArtProject 生态系统中的提示词定义，确保角色原型、任务编排和风格迁移的一致性。

---

## 🎯 Schema Components (模式组件)

### Component 1: Character Archetype (角色原型)

```yaml
type: archetype_library
schema_version: "2.0"
description: "Character archetype definition with personality and props"

archetype:
  name: string                     # Required - Unique identifier
  base_prompt: str                 # Required - Core prompt template
  
  hair_options: list[string]       # Optional - Visual variations
  eye_options: list[string|list]   # Optional - Eye descriptions
  clothing_layers: list[string]    # Optional - Layered attire
  props: list[string]              # Optional - Character accessories
  personality_traits: list[string] # Required - Behavioral patterns
```

**Validation Rules:**
- `name` must be unique across the library
- `base_prompt` cannot exceed 500 characters
- At least one of `hair_options`, `eye_options`, or `clothing_layers` is required
- All strings in `personality_traits` should be ≤ 80 chars

### Component 2: Task Orchestration (任务编排)

```yaml
type: task_orchestrator
schema_version: "1.0"
description: "Multi-step task definition with workflow management"

task:
  name: string                     # Required - Task identifier
  summary: string                  # Optional - One-line description
  goal: string                     # Required - Ultimate objective
  
  steps:
    type: array                    # Required, min: 3, max: 12
    items:
      step_number: integer         # Required, 1-indexed
      action: string               # Required - Primary action
      decision_points: list        # Optional - Branching logic
      validation_criteria: list[string]   # Optional - Success checks
      
  output_format:
    type: array                    # Required
    items:
      format_type: enum            # {markdown, json, csv, code}
      schema_def: object           # Optional - JSON Schema if applicable
```

**Validation Rules:**
- `steps` must have at least 3 and maximum 12 elements
- Each step's `step_number` must be sequential from 1 to N
- At least one `validation_criteria` per step (recommended)
- If `output_format.type` is `json`, `schema_def` is required

### Component 3: Style Transfer Definition (风格迁移定义)

```yaml
type: style_definition
schema_version: "1.0"
description: "Era/lighting/style parameter mappings for transfer"

style:
  name: string                     # Required - Unique style ID
  eras: list[string]               # Optional - Associated historical periods
  lighting_mood: enum              # Required - {ambient, dramatic, cinematic, natural}
  color_palette: object            # Optional - Dominant colors
  
  parameter_mappings:
    type: array                    # Required
    items:
      input_domain: string         # e.g., "text_prompt", "image_description"
      output_parameters: list[string]   # Specific generation params
```

**Validation Rules:**
- `lighting_mood` must be exactly one of the enum values
- `parameter_mappings.input_domain` should align with project domains
- Max 5 `eras` per style definition

